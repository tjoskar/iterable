name: Node CI

on: ["push"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js v12
        uses: actions/setup-node@v3
        with:
          node-version: "24.x"
      - name: ⬇️ Install
        run: npm ci
        env:
          CI: true
      - name: ✅ Test
        run: npm run test
      - name: 🏗 Build
        run: npx tsc
